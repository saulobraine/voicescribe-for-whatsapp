<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WhatsApp Gemini Transcriber</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 23, 42, 0.9);
      --input-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --brand-green: #10b981;
      --brand-cyan: #06b6d4;
      --brand-blue: #3b82f6;
      --brand-purple: #8b5cf6;
      --brand-grad: linear-gradient(135deg, #10b981 0%, #06b6d4 50%, #3b82f6 100%);
      --brand-glow: 0 4px 20px rgba(6, 182, 212, 0.25);
    }

    * { box-sizing: border-box; }
    
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      background: radial-gradient(circle at top left, #0e1e2d 0%, #090d16 100%);
      color: var(--text-main);
      font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      width: 100%;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
      flex-shrink: 0;
    }

    .header-text {
      flex: 1;
      min-width: 0;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 2px;
      background: var(--brand-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.2px;
    }

    .sub {
      color: var(--text-muted);
      font-size: 11px;
      margin: 0;
      line-height: 1.35;
    }

    .btn-admin {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(6, 182, 212, 0.1) 50%, rgba(59, 130, 246, 0.1) 100%);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-bottom: 14px;
      width: 100%;
    }

    .btn-admin:hover {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18) 0%, rgba(6, 182, 212, 0.18) 50%, rgba(59, 130, 246, 0.18) 100%);
      border-color: rgba(6, 182, 212, 0.55);
      box-shadow: 0 2px 12px rgba(6, 182, 212, 0.2);
      transform: translateY(-1px);
    }

    .btn-admin-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-admin-title {
      color: #38bdf8;
      font-weight: 600;
      font-size: 12.5px;
    }

    .btn-admin-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      white-space: nowrap;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 12px;
      color: #cbd5e1;
      margin: 12px 0 6px;
    }

    .model-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
    }

    .model-row select {
      flex: 1 1 0;
      min-width: 0;
      width: 0;
      height: 38px;
      box-sizing: border-box;
      padding: 0 10px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 12.5px;
      outline: none;
      transition: all 0.15s ease;
      cursor: pointer;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .model-row select:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.25);
    }

    .model-row select optgroup {
      background: #0f172a;
      color: #94a3b8;
      font-weight: 600;
    }

    .model-row select option {
      background: #0f172a;
      color: #f8fafc;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-sizing: border-box;
    }

    #refresh {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      padding: 0;
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      border-radius: 8px;
    }

    #refresh:hover:not(:disabled) {
      background: rgba(51, 65, 85, 0.9);
      color: #fff;
      border-color: rgba(6, 182, 212, 0.4);
    }

    #refresh:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes spin-refresh {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .refreshing {
      animation: spin-refresh 0.75s linear infinite !important;
    }

    #save {
      background: var(--brand-grad);
      color: #fff;
      box-shadow: var(--brand-glow);
    }

    #save:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(6, 182, 212, 0.4);
    }

    .secondary {
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .secondary:hover {
      background: rgba(51, 65, 85, 0.9);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      width: 100%;
    }

    .row button {
      flex: 1;
      height: 38px;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      font-size: 11.5px;
      line-height: 1.4;
      border-radius: 6px;
      padding: 6px 10px;
      display: none;
      word-break: break-word;
    }

    .status.ok {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .status.err {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    small {
      display: block;
      margin-top: 14px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.4;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    #clear-cache {
      width: 100% !important;
      margin-top: 10px;
      background: rgba(239, 68, 68, 0.08) !important;
      border: 1px solid rgba(239, 68, 68, 0.25) !important;
      color: #f87171 !important;
      font-size: 11.5px !important;
      padding: 8px 12px;
      border-radius: 8px;
    }

    #clear-cache:hover {
      background: rgba(239, 68, 68, 0.16) !important;
      border-color: rgba(239, 68, 68, 0.45) !important;
      color: #fca5a5 !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="icons/icon48.png" alt="Logo" class="header-icon">
      <div class="header-text">
        <h1>Gemini Transcriber</h1>
        <p class="sub">Transcrição por IA no WhatsApp Web</p>
      </div>
    </div>

    <a href="admin.html" target="_blank" class="btn-admin">
      <div class="btn-admin-left">
        <span>🗝️</span>
        <span class="btn-admin-title">Gerenciar API Keys</span>
      </div>
      <span class="btn-admin-badge">Pool Inteligente</span>
    </a>

    <label for="model">
      <span>✨</span> Modelo de Transcrição
    </label>
    <div class="model-row">
      <select id="model" disabled>
        <option>Carregando modelos...</option>
      </select>
      <button id="refresh" class="secondary" type="button" title="Atualizar lista da API">↻</button>
    </div>

    <div class="row">
      <button id="save">Salvar</button>
      <button id="test" class="secondary" type="button">Testar</button>
    </div>
    
    <div id="status" class="status"></div>

    <small>A lista é obtida diretamente da API Gemini. Suas chaves ficam protegidas exclusivamente no navegador.</small>

    <button id="clear-cache" type="button">Zerar Cache de Transcrições</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
