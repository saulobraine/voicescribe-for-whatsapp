name: Auto Release & Publish on PR Merge

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Obter Versão do Manifest
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Versão detectada: $VERSION (Tag: v$VERSION)"

      - name: Criar e Publicar Git Tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG já existe localmente ou remotamente. Pulando criação de tag."
          else
            echo "Criando tag $TAG..."
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Typecheck e Build da Extensão
        env:
          NODE_OPTIONS: "--experimental-strip-types"
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Compactar Pacote de Produção
        run: |
          cd build
          zip -r ../voicescribe-for-whatsapp.zip .
          cd ..

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          files: voicescribe-for-whatsapp.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publicação automática na Chrome Web Store
      - name: Upload para Chrome Web Store
        if: env.CHROME_CLIENT_ID != ''
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: voicescribe-for-whatsapp.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}

      # Publicação automática no Microsoft Edge Add-ons
      - name: Upload para Microsoft Edge Add-ons
        if: env.EDGE_CLIENT_ID != ''
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: voicescribe-for-whatsapp.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
